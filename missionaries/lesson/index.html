<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Schedule A Lesson · Farmington Bay 6th Ward</title>
<meta name="theme-color" content="#005175">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/cover-favicon-32.png?v=cover1">
<style>
  :root { --ink:#2b2420; --soft:#6d625a; --bg:#faf6f0; --card:#fff; --line:#e8dfd3; --navy:#005175; --gold:#c9a24a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background:linear-gradient(160deg,#005175,#003a55); color:#fff; padding:22px 18px 26px; text-align:center; border-bottom:4px solid var(--gold); }
  header .ward { font:600 13px/1 Georgia, serif; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  header h1 { font:italic 400 30px/1.15 Georgia, serif; margin:8px 0; }
  header p { margin:0 auto; max-width:28em; font:italic 16px/1.45 Georgia, serif; opacity:.95; }
  main { max-width:560px; margin:0 auto; padding:16px 14px 36px; }
  h2 { font:italic 400 22px/1.2 Georgia, serif; margin:18px 0 8px; }
  h3 { font:700 14px/1.2 -apple-system, sans-serif; letter-spacing:.01em; color:var(--navy); margin:14px 0 8px; }
  .note, .hint { color:var(--soft); font-size:14.5px; margin:8px 0; }
  .banner, .hold, .saved, form, .alert { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .banner { border-top:4px solid var(--gold); margin-top:4px; }
  .banner b, .hold h2, .saved h2 { display:block; font:700 18px/1.3 -apple-system, sans-serif; color:var(--navy); margin:0 0 6px; }
  .banner p, .hold p, .saved p { margin:0; }
  .hold { margin-top:14px; border:2px solid var(--navy); }
  .saved { margin-top:14px; border:2px solid #1e7a46; }
  .alert, .field-error { color:#7a1f1f; background:#fdecea; border:1px solid #e4b4b4; border-radius:12px; padding:10px 12px; margin:8px 0 0; font-weight:600; }
  .field-error { font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .evening { width:100%; min-height:64px; text-align:left; border:1.5px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); padding:10px 12px; font:inherit; }
  .evening b { display:block; font-size:16px; color:var(--navy); }
  .evening span { display:block; color:var(--soft); font-size:14px; margin-top:2px; }
  .evening[aria-pressed="true"] { border-color:var(--gold); background:#fff8e6; box-shadow:0 0 0 3px rgba(201,162,74,.35); }
  .picked { font-weight:700; margin:0 0 8px; }
  fieldset { border:0; margin:0; padding:0; }
  legend { font-weight:700; color:var(--navy); padding:0; margin:0 0 4px; }
  .time { display:flex; align-items:center; gap:10px; min-height:48px; border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0; background:#fff; }
  .time input { width:20px; height:20px; margin:0; }
  .field { margin-top:12px; }
  label { font-weight:700; color:var(--navy); }
  input[type="text"] { display:block; width:100%; min-height:48px; margin-top:4px; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font:16px/1.3 inherit; background:#fff; color:var(--ink); }
  input[aria-invalid="true"] { border-color:#b42318; }
  .save, .alt { display:block; width:100%; min-height:52px; margin-top:16px; border-radius:14px; font:700 17px/1.2 inherit; }
  .save { background:var(--navy); color:#fff; border:2px solid var(--gold); }
  .alt { background:#e3eef4; color:var(--navy); border:0; }
  .save:disabled { opacity:.6; }
  .hp { position:absolute; left:-9999px; height:0; overflow:hidden; }
  dl { margin:10px 0 0; }
  dt { font-size:13px; font-weight:700; color:var(--soft); margin-top:8px; }
  dd { margin:0; font-size:16px; overflow-wrap:anywhere; }
  .more { display:inline-block; margin-top:14px; color:var(--navy); font-weight:700; }
  footer { text-align:center; color:var(--soft); font-size:12px; padding:0 16px 28px; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f3ece4; --soft:#bfb2a5; --bg:#1d1916; --card:#27211d; --line:#3a312a; }
    .evening, .time, input[type="text"] { background:#1d1916; color:var(--ink); }
    .evening[aria-pressed="true"] { background:#3a301c; }
    .evening b, legend, label, .banner b, .hold h2 { color:#d7ecf6; }
    .alt { background:#33291f; color:#f3ece4; }
    .alert, .field-error { background:#3a2422; color:#ffd4d0; border-color:#6e3530; }
  }
</style>
<script src="../../nav.js" defer></script>
</head>
<body>
<header>
  <div class="ward">Farmington Bay Stake</div>
  <h1>Schedule A Lesson</h1>
  <p>Host Sister Pettingill and Sister Faku for a gospel lesson in your home. This is the stake sign-up from President Larsen.</p>
</header>
<main id="app"></main>
<footer>
  <a class="more" href="../../orgs/ward-missionaries/">Ward Missionaries</a>
  <div style="margin-top:14px">This is not an official website of The Church of Jesus Christ of Latter-day Saints.</div>
</footer>

<script src="config.js"></script>

  LessonForm.mount(document.getElementById("app"), {
    availability: window.LESSON_AVAILABILITY,
    scriptUrl: window.LESSON_CONFIG && window.LESSON_CONFIG.scriptUrl,
    storage: window.localStorage
  });
</script>

</body>
</html>
