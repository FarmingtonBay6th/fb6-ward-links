<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Submit an Announcement · Farmington Bay 6th Ward</title><meta name="theme-color" content="#005175">
<style>:root{--ink:#2b2420;--soft:#6d625a;--bg:#faf6f0;--line:#e8dfd3;--navy:#005175;--gold:#c9a24a}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:relative;background:linear-gradient(160deg,#005175,#003a55);color:#fff;padding:20px 20px 24px;text-align:center;border-bottom-left-radius:22px;border-bottom-right-radius:22px;border-bottom:4px solid var(--gold)}
header a.back{position:absolute;left:14px;top:12px;color:#fff;opacity:.85;text-decoration:none;font-size:15px}header h1{font:italic 400 28px/1.15 Georgia,serif;margin:18px 0 6px}
header p{margin:0 auto;max-width:28em;font:italic 15px/1.45 Georgia,serif;opacity:.92}
main{max-width:560px;margin:0 auto;padding:16px 14px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 10px rgba(0,0,0,.05)}
label{display:block;font-weight:700;color:var(--navy);margin:12px 0 4px}label small{font-weight:400;color:var(--soft)}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf9}input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{min-height:110px}.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips label{margin:0;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;background:#fffdf9}
.chips input{width:auto;margin-right:6px}.hp{position:absolute;left:-9999px}
button{display:block;width:100%;background:var(--navy);color:#fff;font-weight:700;font-size:19px;padding:16px;border-radius:16px;border:2px solid var(--gold);margin-top:16px}
.note{color:var(--soft);font-size:14px;text-align:center}#msg{font-weight:700;text-align:center;margin-top:12px}.preview-flag{background:#fff3cd;border:1px dashed var(--gold);border-radius:10px;padding:8px;text-align:center;font-size:14px}
</style></head><body>
<header><a class="back" href="../">‹ Ward Links</a><h1>Submit an Announcement</h1><p>No sign-in needed. Every request is reviewed before it goes in the program or on Ward Links.</p></header>
<main><div class="preview-flag" id="pf">PREVIEW: not connected yet</div>
<form id="f" class="card" novalidate>
<label for="name">Your Name</label><input id="name" name="name" required autocomplete="name">
<label for="contact">Phone or Email <small>(optional, for questions)</small></label><input id="contact" name="contact" autocomplete="email">
<label for="title">Announcement Title</label><input id="title" name="title" required maxlength="140" placeholder="Primary Program Practice">
<label for="details">Details</label><textarea id="details" name="details" required maxlength="3000" placeholder="What, when, where, and who to contact"></textarea>
<div class="row"><div><label for="start">Start Date</label><input id="start" name="start" type="date"></div><div><label for="end">End Date</label><input id="end" name="end" type="date"></div></div>
<label>Where Should It Go?</label><div class="chips"><label><input type="radio" name="where" value="Program">Program</label><label><input type="radio" name="where" value="Ward Links">Ward Links</label><label><input type="radio" name="where" value="Both" checked>Both</label></div>
<label for="link">Link <small>(optional)</small></label><input id="link" name="link" type="url" placeholder="https://">
<label for="file">Flyer <small>(optional: JPG, PNG, HEIC or PDF, up to 10 MB)</small></label><input id="file" name="file" type="file" accept=".jpg,.jpeg,.png,.heic,.heif,.pdf,image/jpeg,image/png,image/heic,application/pdf">
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit">Send My Announcement</button><div id="msg" role="status"></div></form>
<p class="note">Your announcement goes to a private list for review. It is never posted automatically.</p></main>
<script>
const GAS_URL = '';   // set to the Apps Script web app /exec URL once Adam deploys it
const MAX = 10 * 1024 * 1024, OK = ['jpg','jpeg','png','heic','heif','pdf'];
if (GAS_URL) document.getElementById('pf').remove();
const f = document.getElementById('f'), msg = document.getElementById('msg');
const b64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
f.addEventListener('submit', async ev => {
  ev.preventDefault(); const v = Object.fromEntries(new FormData(f)); delete v.file;
  if (!v.name.trim() || !v.title.trim() || !v.details.trim()) { msg.textContent = 'Please fill in your name, a title and the details.'; return; }
  const file = document.getElementById('file').files[0];
  if (file) { const ext = file.name.split('.').pop().toLowerCase();
    if (!OK.includes(ext)) { msg.textContent = 'Flyer must be JPG, PNG, HEIC or PDF.'; return; }
    if (file.size > MAX) { msg.textContent = 'Flyer must be 10 MB or smaller.'; return; }
    v.file = { name: file.name, type: file.type, data: await b64(file) }; }
  if (!GAS_URL) { msg.textContent = 'Preview only: this form is not connected yet.'; return; }
  const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Sending…';
  try { const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(v) });
    const j = await r.json(); if (j.ok) { f.reset(); msg.textContent = 'Thank you! Your announcement was sent for review.'; } else msg.textContent = j.error; }
  catch (e) { msg.textContent = 'Could not send. Please try again.'; }
  btn.disabled = false; btn.textContent = 'Send My Announcement';
});
</script></body></html>
