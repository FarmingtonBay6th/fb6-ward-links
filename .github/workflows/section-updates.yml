# Rebuilds data/section-updates.json whenever Hub content lands on main, so unread
# dots track real section changes without a hand edit. The bot commit only touches
# the manifest, and that path is ignored here so the workflow does not loop.
name: Section Updates
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/section-updates.json"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section-updates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unread dot logic
        run: node --test tools/section-seen.test.js
      - name: Manifest builder
        run: python3 tools/test_section_updates.py
      - name: Young Men activity calendar
        run: |
          python3 tools/test_ym_activities.py
          node --test tools/ym-cal.test.js
      - name: Young Men roster privacy
        run: python3 tools/test_ym_roster.py
      - name: Past event prune
        run: python3 tools/test_prune_events.py

  manifest:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild section manifest
        run: python3 tools/build_section_updates.py
      - name: Commit if a section hash changed
        run: |
          git config user.name "bay6-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/section-updates.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update section unread manifest"
          git push
