# DRAFT – builds the Bay 6 Calendar from the official Church sync feed every 8 hours.
# Needs repo secret CHURCH_ICS_URL (Settings → Secrets and variables → Actions). Never echo it.
name: Sync Bay 6 Calendar
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
# One sync at a time. A second run waits so two pushes cannot overlap.
concurrency:
  group: calendar-sync
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # History so a rebase can replay onto commits that landed after queue time.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fast-forward to latest main
        run: bash tools/commit_calendar.sh fast-forward
      - name: Build calendar
        env:
          CHURCH_ICS_URL: ${{ secrets.CHURCH_ICS_URL }}
        run: python3 tools/build_calendar.py "$CHURCH_ICS_URL" > /dev/null
      - name: Commit if changed
        env:
          CHURCH_ICS_URL: ${{ secrets.CHURCH_ICS_URL }}
        run: bash tools/commit_calendar.sh publish
